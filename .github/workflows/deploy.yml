name: Deploy Backend to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Lowercase Image Name
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPO_LOWER}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Azure & Deploy Container App
        env:
          AZURE_CREDS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          echo "🔑 Logging in to Azure via Azure CLI..."
          CLIENT_SECRET=$(echo "$AZURE_CREDS" | jq -r '.clientSecret // .password // empty')
          if [ -z "$CLIENT_SECRET" ]; then
            CLIENT_SECRET="ool8Q~XNi.qfPL8hWPMHRBrQsuYvNgoMw2xgaamf"
          fi

          az login --service-principal \
            -u "7020962b-5034-4b6b-ad6c-5ef9e065804a" \
            -p "$CLIENT_SECRET" \
            --tenant "c29a5e9f-c9a9-4106-b23b-7ed415ad75b4"

          az account set --subscription "9cbb58cd-568f-4f74-9979-9f3987627bcb"

          echo "🚀 Configuring Container Registry & updating Azure Container App..."
          az containerapp registry set \
            --name zewito-backend-api \
            --resource-group rg-zewitobe-prod \
            --server ghcr.io \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" || true

          az containerapp update \
            --name zewito-backend-api \
            --resource-group rg-zewitobe-prod \
            --image "${{ steps.meta.outputs.image }}:${{ github.sha }}"
