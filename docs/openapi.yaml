openapi: 3.0.3
info:
  title: Hungry-Hub Food Delivery API
  description: Minimal OpenAPI spec covering auth, restaurants, menu, and orders (initial draft)
  version: 1.0.0
servers:
  - url: http://localhost:5000
    description: Local server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
    User:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          type: string
    Address:
      type: object
      properties:
        addressLine1: { type: string }
        addressLine2: { type: string }
        city: { type: string }
        state: { type: string }
        pincode: { type: string }
        coordinates:
          type: object
          properties:
            lat: { type: number }
            lng: { type: number }
    Restaurant:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        address: { $ref: '#/components/schemas/Address' }
        deliveryFee: { type: number }
        isOpen: { type: boolean }
    MenuItem:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        price: { type: number }
        isVeg: { type: boolean }
        images:
          type: array
          items:
            type: object
            properties:
              url: { type: string }
    OrderItem:
      type: object
      properties:
        menuItemId: { type: string }
        name: { type: string }
        price: { type: number }
        quantity: { type: integer }
    Order:
      type: object
      properties:
        _id: { type: string }
        orderId: { type: string }
        customerId: { $ref: '#/components/schemas/User' }
        restaurantId: { $ref: '#/components/schemas/Restaurant' }
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        subtotal: { type: number }
        finalAmount: { type: number }
        status: { type: string }
paths:
  /api/v1/auth/register:
    post:
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                phone: { type: string }
                email: { type: string }
                role: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/login:
    post:
      summary: Login via phone/password or OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { type: string }
                password: { type: string }
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
  /api/v1/restaurants:
    get:
      summary: List restaurants (supports query filters)
      parameters:
        - in: query
          name: city
          schema:
            type: string
        - in: query
          name: cuisine
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Restaurant'
  /api/v1/restaurants/{id}:
    get:
      summary: Get restaurant details
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
  /api/v1/menu:
    get:
      summary: List menu items for a restaurant
      parameters:
        - in: query
          name: restaurantId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MenuItem'
  /api/v1/orders:
    post:
      security:
        - bearerAuth: []
      summary: Create a new order (customer only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                restaurantId: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      menuItemId: { type: string }
                      quantity: { type: integer }
                deliveryAddress: { $ref: '#/components/schemas/Address' }
                paymentMethod: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Bad Request
  /api/v1/orders/my-orders:
    get:
      security:
        - bearerAuth: []
      summary: Get current user's orders (supports pagination & filter)
      parameters:
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
security:
  - bearerAuth: []
